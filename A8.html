<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            width: 500px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .header {
            padding: 20px;
            font-size: 30px;
            color: #fff;
            background-color: black;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .item-list {
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .item {
            width: 100%;
            border-bottom: 1px solid gray;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .item > div {
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .item > div > img {
            width: 60px;
            border-radius: 10%;
        }


        .text-area {
            display: flex;;
            flex-direction: column;
            gap: 2px;
            color: gray;
            font-size: 12px;
        }

        .item-name {
            color: black;
            font-weight: bold;
            font-size: 14px;
        }

        .amount {
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .amount > button {
            border: 1px solid gray;
            background-color: #fff;
            border-radius: 10%;
        }

        .item > div > span {
            font-weight: bold;
        }

        .delete {
            width: 10px;
            height: 10px;
            padding: 10px;
            color: #fff;
            border-radius: 50%;
            background-color: red;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .receipt {
            background-color: rgb(177, 177, 177);
        }

        .receipt > div {
            padding: 20px;
        }

        .top {
            border-bottom: 1px solid gray;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .top > div {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
        }

        .total {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
        }

        .footer {
            padding: 20px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .footer > div {
            padding: 10px;
            border-radius: 10px;
            color: #fff;
        }

        .footer > div:nth-child(1) {
            background-color: gray;
        }
        
        .footer > div:nth-child(2) {
            background-color: rgb(57, 153, 27);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">장바구니</div>
        <div class="item-list">
            <div class="item">
                <div>
                    <img src="imgs/tshirt.jpg" alt="item">
                    <div class="text-area">
                        <div class="item-name">WorldSkills 공식 티셔츠</div>
                        <span>색상: 네이비</span>
                        <span>사이즈: L</span>
                    </div>
                </div>
                <div>
                    <div class="amount">
                        <button>-</button>
                        <span>2</span>
                        <button>+</button>
                    </div>
                    <span>25,000원</span>
                    <div class="delete">x</div>
                </div>
            </div>

            <div class="item">
                <div>
                    <img src="imgs/book.jpg" alt="item">
                    <div class="text-area">
                        <div class="item-name">기능경기 가이드북</div>
                        <span>종류: 웹디자인</span>
                        <span>2026년 최신판</span>
                    </div>
                </div>
                <div>
                    <div class="amount">
                        <button>-</button>
                        <span>1</span>
                        <button>+</button>
                    </div>
                    <span>15,000원</span>
                    <div class="delete">x</div>
                </div>
            </div>

            <div class="item">
                <div>
                    <img src="imgs/laptop-case.jpg" alt="item">
                    <div class="text-area">
                        <div class="item-name">WorldSkills 노트북 파우치</div>
                        <span>색상: 블랙</span>
                        <span>15인치 호환</span>
                    </div>
                </div>
                <div>
                    <div class="amount">
                        <button>-</button>
                        <span>1</span>
                        <button>+</button>
                    </div>
                    <span>35,000원</span>
                    <div class="delete">x</div>
                </div>
            </div>
        </div>
        <div class="receipt">
            <div class="top">
                <div>
                    <span>상품금액</span>
                    <span>75,000원</span>
                </div>
                <div>
                    <span>배송비</span>
                    <span>3,000원</span>
                </div>
            </div>
            <div class="total">
                <span>총 결제금액</span>
                <span>78,000원</span>
            </div>
        </div>
        <div class="footer">
            <div>쇼핑 계속하기</div>
            <div>주문하기</div>
        </div>
    </div>
</body>
</html>
