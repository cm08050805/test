<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: #fff;
            transition: background-color 0.5s;
        }

        input {
            display: none;
        }

        .toggle-box {
            width: 200px;
            height: 80px;
            position: relative;
            border-radius: 50px;
            padding: 10px;
            background-color: #adadad;
            transition: all 0.5s;
        }

        .toggle-box > div {
            width: 80px;
            height: 80px;
            position: absolute;
            left: 10px;
            border-radius: 50%;
            background-color: #fff;
            transition: all 0.5s;
        }

        body:has(input:checked) {
            background-color: #222;
        }

        #toggle:checked ~ .toggle-box {
            background-color: #092ca0;
        }

        #toggle:checked ~ .toggle-box > div {
            background-color: yellow;
            left: 120px;
        }
    </style>
</head>
<body>
    <label for="toggle">
        <input type="checkbox" name="toggle" id="toggle">
        <div class="toggle-box">
            <div></div>
        </div>
    </label>
</body>
</html>
